<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Galerie photos de la Communauté de Centrafrique du Ghana.">
    <title>Galerie photos | CCG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section id="gallery" class="section" aria-labelledby="gallery-title">
            <h1 id="gallery-title" class="title">Galerie Photos</h1>
            <p class="gallery-intro">Tous les souvenirs partagés par la Communauté de Centrafrique du Ghana.</p>
            <div class="gallery" id="whatsapp-gallery" aria-live="polite"></div>
        </section>
    </main>

    <div class="lightbox" id="gallery-lightbox" aria-hidden="true" role="dialog" aria-label="Aperçu de la photo">
        <button class="close" type="button" aria-label="Fermer l'aperçu">&times;</button>
        <img src="" alt="">
    </div>

    <script>
        const gallery = document.querySelector('#whatsapp-gallery');
        const images = [];
        const add = (name) => images.push(`image/${name}.jpeg`);
        const addSeries = (prefix, seconds) => {
            Object.entries(seconds).forEach(([second, count]) => {
                add(`${prefix}${second}`);
                for (let copy = 1; copy < count; copy += 1) add(`${prefix}${second} (${copy})`);
            });
        };

        add('WhatsApp Image 2026-07-09 at 1.46.42 PM (1)');
        add('WhatsApp Image 2026-07-09 at 2.14.53 PM');
        addSeries('WhatsApp Image 2026-07-31 at 10.21.', { '44 AM': 2, '45 AM': 4 });
        addSeries('WhatsApp Image 2026-07-31 at 11.02.', { '55 AM': 2, '56 AM': 6, '57 AM': 6, '58 AM': 1 });
        addSeries('WhatsApp Image 2026-07-31 at 11.59.', { '46 AM': 2, '47 AM': 1 });
        addSeries('WhatsApp Image 2026-08-01 at 8.14.', { '28 PM': 1, '29 PM': 6, '30 PM': 2 });
        addSeries('WhatsApp Image 2026-08-07 at 12.39.', { '53 PM': 3, '54 PM': 6, '55 PM': 7, '56 PM': 6, '57 PM': 6, '58 PM': 6, '59 PM': 6 });
        addSeries('WhatsApp Image 2026-08-07 at 12.59.', { '29 PM': 3, '30 PM': 3, '31 PM': 6, '32 PM': 6, '33 PM': 3 });
        addSeries('WhatsApp Image 2026-08-07 at 1.07.', { '15 PM': 4, '16 PM': 4, '17 PM': 5, '18 PM': 3, '19 PM': 4, '20 PM': 4, '21 PM': 5, '22 PM': 2, '23 PM': 4, '24 PM': 3, '25 PM': 3, '26 PM': 3, '27 PM': 3, '28 PM': 6, '29 PM': 4, '30 PM': 4, '31 PM': 3, '32 PM': 4, '33 PM': 5, '34 PM': 4, '35 PM': 4, '36 PM': 4, '37 PM': 5, '38 PM': 5, '39 PM': 4, '40 PM': 1 });
        addSeries('WhatsApp Image 2026-08-07 at 1.10.', { '30 PM': 1, '31 PM': 5, '32 PM': 4, '33 PM': 4, '34 PM': 3, '35 PM': 3, '36 PM': 4, '37 PM': 3, '38 PM': 3, '39 PM': 3, '40 PM': 2, '41 PM': 5, '42 PM': 3, '43 PM': 4, '44 PM': 5, '45 PM': 6, '46 PM': 5, '47 PM': 4, '48 PM': 5, '49 PM': 5, '50 PM': 1 });

        images.forEach((src, index) => {
            const image = document.createElement('img');
            image.src = src;
            image.alt = `Photo CCG ${index + 1}`;
            image.loading = 'lazy';
            image.decoding = 'async';
            gallery.appendChild(image);
        });

        const lightbox = document.querySelector('#gallery-lightbox');
        const lightboxImage = lightbox.querySelector('img');
        const close = () => {
            lightbox.classList.remove('active');
            lightbox.setAttribute('aria-hidden', 'true');
        };

        gallery.addEventListener('click', (event) => {
            if (event.target.tagName !== 'IMG') return;
            lightboxImage.src = event.target.src;
            lightboxImage.alt = event.target.alt;
            lightbox.classList.add('active');
            lightbox.setAttribute('aria-hidden', 'false');
        });

        lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox || event.target.classList.contains('close')) close();
        });
        document.addEventListener('keydown', (event) => { if (event.key === 'Escape') close(); });
    </script>
</body>
</html>
